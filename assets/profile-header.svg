<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">teriyakki-jin Security Engineering Portfolio</title>
  <desc id="desc">Dark blue security-themed banner with network nodes and a green verification signal.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1c31"/>
      <stop offset="1" stop-color="#10243a"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#27425f" stroke-width="1" opacity="0.3"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#background)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <path d="M0 276 C220 210 340 326 560 260 S890 218 1200 278" fill="none" stroke="#1d3a55" stroke-width="2"/>

  <g transform="translate(70 64)">
    <rect x="0" y="0" width="7" height="192" rx="3.5" fill="url(#signal)"/>
    <text x="34" y="32" fill="#67e8f9" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="4">SECURITY ENGINEERING</text>
    <text x="34" y="100" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="750">teriyakki-jin</text>
    <text x="34" y="144" fill="#afc2d8" font-family="Segoe UI, Arial, sans-serif" font-size="22">Zero Trust · Network Forensics · AI Security</text>
    <g transform="translate(34 169)">
      <circle cx="8" cy="8" r="8" fill="#34d399" filter="url(#glow)"/>
      <path d="M4 8.2 7 11l5-6" fill="none" stroke="#052e26" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="13" fill="#86efac" font-family="Consolas, Menlo, monospace" font-size="15">REPRODUCIBLE · TESTED · EVIDENCE-DRIVEN</text>
    </g>
  </g>

  <g transform="translate(930 160)" fill="none" stroke-linecap="round">
    <path d="M0 0 82-64 178-18 236-92" stroke="#365a78" stroke-width="2"/>
    <path d="M0 0 72 76 178 46 236 92" stroke="#365a78" stroke-width="2"/>
    <path d="M82-64 178 46M178-18 72 76" stroke="#274964" stroke-width="2"/>
    <g fill="#0b1c31" stroke="url(#signal)" stroke-width="3">
      <circle cx="0" cy="0" r="13"/>
      <circle cx="82" cy="-64" r="11"/>
      <circle cx="178" cy="-18" r="14"/>
      <circle cx="236" cy="-92" r="9"/>
      <circle cx="72" cy="76" r="11"/>
      <circle cx="178" cy="46" r="12"/>
      <circle cx="236" cy="92" r="9"/>
    </g>
    <circle cx="178" cy="-18" r="5" fill="#34d399" stroke="none" filter="url(#glow)"/>
  </g>
</svg>
